services:
  debisim2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: debisim2:latest

    # GPU access — requires NVIDIA Container Toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Mount results directory for output persistence
    volumes:
      - ../results:/app/results
      - ../examples/stl_pools:/app/examples/stl_pools:ro

    # Override default command with environment variables
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}

    # Default: calibration phantom (override with docker compose run)
    command: >
      --config configs/config_calibration_phantom_dect.py
      --sim_dir results/calibration_phantom/
      --num_bags 1

  # Run tests
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["python", "-m", "pytest"]
    command: ["tests/", "-v", "--tb=short"]
    volumes:
      - ../results:/app/results

  # Run benchmark
  benchmark:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["python", "benchmarks/bench_pipeline.py"]
    command: >
      --config configs/config_calibration_phantom_dect.py
      --sim_dir results/bench_docker/
    volumes:
      - ../results:/app/results
      - ../benchmarks/results:/app/benchmarks/results
