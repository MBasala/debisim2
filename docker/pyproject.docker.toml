[project]
name = "debisim2"
version = "0.1.0"
description = "DEBISim2: Dual-Energy Baggage Inspection Simulator"
requires-python = ">=3.12, <3.13"
dependencies = [
    "pyyaml>=6.0",
    "torch",
    "torchvision",
    "tabulate",
    "scikit-image",
    "scikit-learn",
    "brt",
    "scipy",
    "astra-toolbox",
    "trimesh",
    "scipy-stubs>=1.17",
    "tqdm",
    "matplotlib",
    "pydicom",
    "astropy",
    "psutil",
    "pytest",
    "pytest-mock",
]
